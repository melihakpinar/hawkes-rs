[workspace]
resolver = "3"
members = ["hawkes", "hawkes-python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/melihakpinar/hawkes-rs"
authors = ["Mesut Melih Akpinar <mesutmelihakpinar@gmail.com>"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is not optional here. Without it serde_json's fast float path is
# not correctly rounded and parses some of the fixture literals one ulp away from the
# nearest double -- so Rust would be computing on events that differ from the ones tick
# simulated. Found by M3's bit-identity test, which compared a value computed from
# serde_json's parse against one computed from CPython's (correctly rounded) parse.
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1"
rayon = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"

# `cargo test` runs the statistical oracles: round-trip fits over hundreds of
# randomized parameter sets, KS residuals on realizations of thousands of events. At
# `opt-level = 0` the multivariate round trip alone takes over ten minutes, which is
# the kind of number that gets a test's coverage quietly reduced instead of its build
# settings fixed. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 2
