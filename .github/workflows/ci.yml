name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that is not an error is a warning that gets ignored.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The three commands from CLAUDE.md §4 "definition of done", in that order.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # The default feature set is what most callers build, and `rayon` changes which
      # code paths compile. Both are run.
      - name: cargo test (default features)
        run: cargo test

  python:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --upgrade pip maturin pytest mypy numpy

      # Generated on this machine, for the reason in `dump_fixture_nll`: the values
      # are platform-dependent, so a committed reference would assert a
      # reproducibility that does not hold.
      - name: Generate the Rust reference
        run: cargo run --example dump_fixture_nll target/rust-nll.json

      - name: Build and install the extension
        run: maturin develop --manifest-path hawk-python/Cargo.toml
        env:
          VIRTUAL_ENV: ${{ env.pythonLocation }}

      - name: mypy --strict
        run: mypy --strict hawk-python/python/hawk hawk-python/examples

      - name: pytest
        run: python -m pytest hawk-python/tests -q

  fixtures:
    name: fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rebuilds the pinned tick oracle and regenerates every fixture, then fails if
      # anything differs from what is committed. This is what stops a fixture from
      # being hand-edited, or from silently drifting when the image is changed.
      #
      # linux/amd64 is the pinned platform (benchmarks/docker/README.md) and matches
      # the runner, so no emulation is needed here.
      - name: Build the tick oracle image
        run: docker build --platform=linux/amd64 -t hawk-tick:0.8.0.2 benchmarks/docker

      - name: Smoke-test the oracle
        run: docker run --rm --platform=linux/amd64 hawk-tick:0.8.0.2

      - name: Fixtures match the oracle byte-for-byte
        run: |
          docker run --rm --platform=linux/amd64 \
            -v "$PWD/tests/fixtures":/out \
            hawk-tick:0.8.0.2 \
            python /work/generate_fixtures.py --out /out --check
